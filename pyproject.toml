[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "2.3.0"
description = "Temporal fraud risk modeling and observable prediction service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.3", "pandas==2.3.3", "scipy==1.16.2",
  "scikit-learn==1.7.2", "joblib==1.5.2", "fastapi==0.142.2",
  "cryptography==50.0.2", "uvicorn==0.37.0", "prometheus-client==0.23.1", "matplotlib==3.10.6"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.13.2"]

[project.scripts]
fraudguard = "fraudguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraudguard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
