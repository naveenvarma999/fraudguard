name: dependency-security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - name: Audit pinned runtime dependencies
        run: pip-audit -r requirements.lock --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
# A finding fails this job. Review upgrades against serialized-model compatibility;
# never suppress findings merely to obtain a passing build.
