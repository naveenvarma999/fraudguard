name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: pip install '.[tracking]' -c requirements.lock
      - run: ruff check .
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dashboard.test.mjs
      - name: Reproduce behavioral evaluation
        run: fraudguard behavioral-experiment --output artifacts/behavioral-ci --seed 42
      - name: Assert committed results reproduce
        run: python -m fraudguard.reproduce --expected artifacts/behavioral/report.json --actual artifacts/behavioral-ci/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: behavioral-evaluation
          path: artifacts/behavioral-ci/report.json
      - run: docker build -t fraudguard:test .
      - name: Container readiness smoke test
        run: |
          docker run -d --name fraudguard -p 8000:8000 -e API_KEY=ci-only-key-not-for-production -e STATE_DIR=/data fraudguard:test
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/health/ready; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health/ready
          curl --fail http://localhost:8000/ > /dev/null
          curl --fail http://localhost:8000/assets/app.mjs > /dev/null
          curl --fail http://localhost:8000/ui/demo > /dev/null
          curl --fail -H 'X-API-Key: ci-only-key-not-for-production' -H 'Content-Type: application/json' --data @docs/behavioral-request.json http://localhost:8000/v1/behavioral/predict
      - name: Persistent workspace load gate
        env:
          API_KEY: ci-only-key-not-for-production
        run: python scripts/benchmark_api.py --requests 50 --concurrency 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-load-report
          path: artifacts/operations/load_test.json
      - name: Verify deployment contracts
        run: docker exec fraudguard python -m fraudguard.deployment --expected-version 2.4.0
      - name: Check Linux deployment script syntax
        run: |
          bash -n scripts/Deploy-Checked.sh
          bash -n scripts/Export-Backup-S3.sh
          bash -n scripts/Compose.sh
          bash -n infra/bootstrap.sh.tftpl
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.1'
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
