# Optional same-host scoring pool. The workspace API remains a single coordinator.
services:
  api:
    environment:
      INFERENCE_WORKERS: http://worker-a:8000,http://worker-b:8000
      INFERENCE_KEY: ${INFERENCE_KEY:?Run scripts/configure_security.py}
    mem_limit: 512m
  worker-a: &worker
    image: fraudguard-api:2.6.0
    command: ["uvicorn", "fraudguard.worker:create_worker", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--limit-concurrency", "8", "--no-access-log"]
    environment:
      INFERENCE_KEY: ${INFERENCE_KEY:?Run scripts/configure_security.py}
      REGISTRY_DIR: ${FRAUDGUARD_STATE_DIR:-/data}/releases
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - workspace_data:/data:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  worker-b:
    <<: *worker
